<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Adicionando conteúdos</title>
    </head>
    <body>
        <h1>Conteúdos dentro de iframes</h1>
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad iste
            ducimus aut accusamus commodi ea cumque, repudiandae atque possimus
            voluptates magnam eligendi qui! Obcaecati rerum molestias officia
            corporis illo ad.
        </p>
        <h2>vídeos</h2>
        <div style="padding: 68.13% 0 0 0; position: relative">
            <iframe
                src="https://player.vimeo.com/video/1174786241?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
                frameborder="0"
                allow="
                    autoplay;
                    fullscreen;
                    picture-in-picture;
                    clipboard-write;
                    encrypted-media;
                    web-share;
                "
                referrerpolicy="strict-origin-when-cross-origin"
                style="
                    position: absolute;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                "
                title="Full Set"
            ></iframe>
        </div>
        <script src="https://player.vimeo.com/api/player.js"></script>

        <!--Maps-->

        <h2>Mapa do google</h2>

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d30324.12048007366!2d-42.4116224!3d-18.186239999999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1775588401397!5m2!1spt-BR!2sbr"
            width="600"
            height="450"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
        ></iframe>

        <h2>Mapa do Waze</h2>

        <iframe
            src="https://embed.waze.com/iframe?zoom=16&lat=-18.193000&lon=-42.412809&ct=livemap"
            width="600"
            height="450"
            allowfullscreen
        ></iframe>

        <!--FIM MAPS-->
    </body>
</html>
