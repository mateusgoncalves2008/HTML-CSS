<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0%;
            }

            #filme {
                width: 100%;
                height: 98vh;
            }
        </style>
    </head>
    <body>
        <iframe
            id="filme"
            src="https://www.youtube.com/embed/LvpVg1cFVMw?si=FLzv1KqL4qUqTMTy"
            title="YouTube video player"
            frameborder="0"
            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
        ></iframe>
    </body>
</html>
