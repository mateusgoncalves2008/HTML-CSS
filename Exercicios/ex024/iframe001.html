<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Estudos de iFrame</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }

            iframe {
                width: 550px;
                height: 500px;
            }
        </style>
    </head>
    <body>
        <h1>Testando o uso de um iframe</h1>
        <p>
            <!-- Tamanho padrão 300x150 -->

            Acessando o site do
            <iframe src="https://www.cursoemvideo.com/" frameborder="0">
                <a href="https://www.cursoemvideo.com/"></a
            ></iframe>
            para aprender a programar.
        </p>

        <p>
            O site do
            <iframe
                src="https://www.mercadolivre.com.br/
            "
                frameborder="0"
            >
                <a href="https://www.mercadolivre.com.br/"></a
            ></iframe>
            também é muito legal!
        </p>
    </body>
</html>
