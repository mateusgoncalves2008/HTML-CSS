<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flexible Box</title>
        <style>
            .conteiner {
                background-color: red;
                display: flex;
                flex-flow: row wrap;
                justify-content: center;
            }

            .item {
                text-align: center;
                border: 2px solid black;
                background-color: yellow;
                padding: 20px;
            }

            #i1 {
                order: 0;
            }

            #i2 {
                order: 0;
            }

/* A propriedade order serve pra você controlar os elementos visual sem modificar no document HTML */
/* Ele funciana assim: quanto menor o número for, em primeiro ele vai ficar. Ex: (Embaixo) */

            #i3 {
                order: -1;
            }
        </style>
    </head>
    <body>
        <div class="conteiner">
            <div class="item" id="i1">A</div>
            <div class="item" id="i2">B</div>
            <div class="item" id="i3">C</div>
        </div>
    </body>
</html>
