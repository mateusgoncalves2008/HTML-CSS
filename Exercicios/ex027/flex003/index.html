<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flexible Box</title>
        <style>
            .conteiner {
                background-color: rgba(79, 219, 66, 0.664);
                display: flex;
                /* flex-direction: row;
                flex-wrap: nowrap; */
                flex-flow: column wrap;
                height: 200px;
            }

            .item {
                text-align: center;
                border: 1px solid black;
                background-color: yellow;
                flex: auto;
                transition: all 0.5s;
            }

            .item:hover {
                transform: scale(1.1);
            }
        </style>
    </head>
    <body>
        <div class="conteiner">
            <div class="item">Exemplo de Bloco A</div>
            <div class="item">Exemplo de Bloco B</div>
            <div class="item">Exemplo de Bloco C</div>
            <div class="item">Exemplo de Bloco D</div>
            <div class="item">Exemplo de Bloco F</div>
            <div class="item">Exemplo de Bloco G</div>
        </div>
    </body>
</html>
