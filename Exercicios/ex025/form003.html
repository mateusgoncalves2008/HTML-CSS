<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Formulário</title>
    </head>
    <body>
        <h1>Teste de Formulário</h1>
        <form action="cadastro.php" autocomplete="on" method="get">
            <p>
                <label for="inome">Nome</label>
                <input
                    type="text"
                    id="inome"
                    name="name"
                    required
                    maxlength="30"
                    placeholder="Nome do Usuário"
                    autocomplete="name"
                />
            </p>

            <p>
                <label for="imedia">Média</label>
                <input
                    type="number"
                    name="media"
                    id="imedia"
                    required
                    placeholder="0 a 10"
                    step="0.1"
                    min="0"
                    max="10"
                />
            </p>

            <p>
                <label for="imes">Período Letivo</label>
                <input type="month" name="mes" id="imes" />
            </p>

            <p>
                <label for="idia">Dia da prova</label>
                <input type="date" name="dia" id="idia">
            </p>

            <p>
                <label for="ihora">Hora:</label>
                <input type="time" name="hora" id="ihora">
            </p>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </body>
</html>
