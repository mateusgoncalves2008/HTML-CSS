<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                font-family: Arial, Helvetica, sans-serif;

                h2 {
                    font-size: 16px;
                    padding: 5px 0px 0px 10px;
                }

                .card-1, .card-2 {
                    width: 10rem;
                    height: 11rem;
                }
            }

            h1 {
                text-align: center;
                margin-bottom: 20%;
            }

            .container {
                display: flex;
                justify-content: center;
                gap: 1rem;

                .card-1 {
                    background-color: blue;
                    border-radius: 7px;
                    color: white;
                }

                .card-2 {
                    background-color: red;
                    border-radius: 7px;
                }
            }
        </style>
    </head>
    <body>
        <h1>Teste sem o <strong>tailwindcss</strong></h1>

        <div class="container">
            <div class="card-1">
                <h2><strong>Photo 1</strong></h2>
            </div>

            <div class="card-2">
                <h2><strong>Photo 2</strong></h2>
            </div>
        </div>
    </body>
</html>
