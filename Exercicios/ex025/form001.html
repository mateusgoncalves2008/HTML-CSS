<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fomulário</title>
        <style>
            * {
                font-family: Arial, Helvetica, sans-serif;
                color: white;
            }

            body {
                background-color: rgb(47, 47, 47);
                text-align: center;
            }

            form {
                button {
                    background-color: rgb(255, 248, 33);
                    padding: 5px;
                    font-weight: bold;
                    margin-left: 13rem;
                    border-radius: 5px;
                    transition: 0.5s;
                }

                button:hover {
                    padding: 5.4px;
                    transition: 0.5s;
                    box-shadow: 0px 0px 5px 0px rgb(255, 248, 33);
                }

                input {
                    background-color: rgb(255, 255, 210);
                    transition: 0.2s;
                }

                input:hover {
                    box-shadow: 0px 0px 5px 0px rgb(255, 248, 33);
                    transition: 0.2s;
                }
            }

            button,
            input {
                color: black;
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <h1>Meu primeiro formulário!</h1>

        <form autocomplete="off" action="cadastro.php" method="  dialog">
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" />
            </p>

            <p>
                <label for="isobrenome">Sobrenome</label>:
                <input type="text" name="sobrenome" id="isobrenome" />
            </p>

            <button>ENVIAR</button>
        </form>
    </body>
</html>
