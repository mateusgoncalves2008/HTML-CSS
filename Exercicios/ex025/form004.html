<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Formulário</title>
    </head>
    <body>
        <h1>Exemplo de Formulário</h1>
        <form action="cadastro.php" autocomplete="on" method="get">
            <fieldset>
                <legend>Name & Sobrenome</legend>

                <div class="Usuário">
                    <label for="iusu">Usuário:</label>
                    <input
                        type="text"
                        id="iusu"
                        required
                        placeholder="Digite seu nome"
                        minlength="4"
                        maxlength="30"
                    />
                </div>

                <div class="sobrenome">
                    <label for="isobrenome">Sobrenome:</label>
                    <input
                        type="text"
                        id="isobrenome"
                        name="sobrenome"
                        required
                        placeholder="Digite seu Sobrenome"
                    />
                </div>
            </fieldset>
    
            <br>
            <br>

            <fieldset>
                <legend>Dados pessoais</legend>
                <div class="e-mail">
                    <label for="iemail">E-mail:</label>
                    <input
                        type="email"
                        id="iemail"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="Digite seu E-mail"
                    />
                </div>

                <div class="senha">
                    <label for="isen">Senha</label>
                    <input type="password" id="isen" name="senha" required placeholder="Senha" minlength="7" maxlength="30"/>
                </div>

                <div>
                    <label for="itel">Telefone:</label>
                    <input
                        type="tel"
                        id="itel"
                        name="tel"
                        autocomplete="tel"
                        pattern="^\(\d{2}\)d{4,5}-\d{4}$"
                        required
                        placeholder="(xx) xxxx-xxxx"
                    />
                </div>
                <br />

                <div class="botao">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </div>
            </fieldset>
        </form>
    </body>
</html>
